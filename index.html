<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>国家試験2027対策アプリ</title>
  <script>
    // Keep bookmarks that pointed directly to a question bank before the move.
    if (/^#app=(grad|term|class|national)$/.test(location.hash)) {
      location.replace('./oniki.html' + location.search + location.hash);
    }
  </script>
  <style>
    :root { color-scheme: light; font: 16px system-ui, sans-serif; background: #f4f7fb; color: #182840; }
    body { margin: 0; }
    main { max-width: 36rem; margin: 0 auto; padding: clamp(2rem, 8vw, 5rem) 1rem; }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 1.5rem; }
    ul { display: grid; gap: .75rem; margin: 0; padding: 0; list-style: none; }
    .school { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      border: 1px solid #d5deec; border-radius: .75rem; padding: 1rem; background: white; }
    a.school { color: #124792; text-decoration: none; }
    a.school:hover { border-color: #124792; }
    a.school:focus-visible { outline: 3px solid #124792; outline-offset: 3px; }
    small { display: block; margin-top: .25rem; color: #465871; }
  </style>
</head>
<body>
  <main>
    <h1>国家試験2027対策アプリ</h1>
    <nav aria-label="学校を選択">
      <ul>
        <li><a class="school" href="./oniki.html">
          <span><strong>鬼木学園</strong><small>あはき師用</small></span>
          <span aria-hidden="true">›</span>
        </a></li>
        <!-- When judo.html is ready, turn this card into a link to ./judo.html. -->
        <li class="school">
          <span><strong>日本医専</strong><small>柔整師用 · 準備中</small></span>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
